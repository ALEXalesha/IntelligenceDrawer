# Проверки на домашнем Gitea. Копия .github/workflows/ci.yml, отличие одно: задачи
# идут на раннер ПК (метка windows), а не на windows-latest / ubuntu-latest - такие метки
# есть только у раннера ноутбука, и без него задачи висели в очереди и отменялись.
# Раз папка .gitea/workflows есть, Gitea берёт проверки только отсюда: выпуски и Pages -
# дело GitHub, здесь их нет. Меняя проверки, править оба файла.

# Проверки на каждый пуш.
#
# Раннер windows: окно на tkinter, а сборка идёт в .exe под Windows. Датасеты для этого
# не нужны - model.pt лежит в репозитории, и тесты работают на нём и на подставной сети.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Зависимости
        run: pip install -r requirements.txt pytest hypothesis

      - name: Проверки
        run: python -m pytest tests -q
